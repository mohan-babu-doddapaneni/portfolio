<!DOCTYPE html>

    <!-- ===================== SECURITY HARDENING ===================== -->
    <!-- Strict Content-Security-Policy: everything is self-hosted (fonts,
         icons, images), so we lock origins down to 'self'. This blocks
         injected/3rd-party scripts, data exfiltration, and most XSS.
         style-src comes from .env.production ('self' only, no inline styles)
         and .env.development (dev server injects <style> tags). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src %REACT_APP_CSP_STYLE_SRC%; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Anti-clickjacking: same-origin frame-buster (CSP-compliant). -->
    <script src="%PUBLIC_URL%/framebuster.js"></script>
    <script src="%PUBLIC_URL%/theme-init.js"></script>
